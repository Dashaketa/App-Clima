<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="image/favicon/Logo.png" type="image/x-icon">
<link rel="shortcut icon" href="image/favicon/Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="Landing.css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App-Weather</title>
  </head>
  <body>
    <!-- Fondo personalizado -->
    <div
      class="absolute inset-0 -z-10 h-full w-full bg-white bg-[linear-gradient(to_right,#f0f0f0_1px,transparent_1px),linear-gradient(to_bottom,#f0f0f0_1px,transparent_1px)] bg-[size:6rem_4rem]"
    >
      <div
        class="absolute bottom-0 left-0 right-0 top-0 bg-[radial-gradient(circle_500px_at_50%_200px,#C9EBFF,transparent)]"
      ></div>
    </div>

    <!-- Contenedor principal -->
    <div
      class="flex flex-col items-center justify-start min-h-screen pt-10 gap-8"
    >
      <div class="titulo-principal">
        <h1 class="text-5xl font-bold">Clima App</h1>
      </div>

      <div class="input flex gap-2">
        <input
          type="text"
          id="city-input"
          placeholder="Ej: Madrid,ES o New York,US"
          class="p-3 rounded-lg w-64 border-none text-black shadow-md"
        />
        <button
          id="search-btn"
          class="p-3 bg-blue-600 hover:bg-blue-300 text-white rounded-lg"
        >
          <img src="image/buscar.svg" alt="Buscar" class="w-3 h-3" />
        </button>
      </div>

      <p id="error-message" style="color: red; margin-top: 10px"></p>

      <div id="weather-container" class="grid-contenedor">
        <div class="box" style="grid-area: box-1">

            <img src="image/Location.svg" alt="Location" class="h-10 w-10"">
          <h3 class="text-3xl font-semibold">Ciudad</h3>

          <p id="city-name">--</p>

          <img id="weather-icon" src="" alt="Ícono del clima" width="80" />

          <h3 class="text-xl font-semibold">Descripción</h3>
          <p id="weather-description">--</p>
        </div>

        <div class="box" style="grid-area: box-2">
            <img src="image/Temperatura.svg" alt="Temperatura" class="w-10 h-10">
          <h3 class="text-xl font-semibold">Temperatura</h3>
          <p id="temperature">--</p>
        </div>
        <div class="box" style="grid-area: box-3">
            <img src="image/Humedad.png" alt=" Humedad" class="w-12 h-10"">
          <h3 class="text-xl font-semibold">Humedad</h3>
          <p><span id="humidity">--</span>%</p>
        </div>
        <div class="box" style="grid-area: box-4">
            <img src="image/viento.svg" alt="viento" class="w-10 h-10">

          <h3 class="text-xl font-semibold">Viento</h3>
          <p><span id="wind-speed">--</span> km/h</p>

          <h3 class="text-xl font-semibold">Presión</h3>
          <p><span id="pressure">--</span> hPa</p>
        </div>

        <div class="box" style="grid-area: box-5">
            <div id="forecast-container" class="grid grid-cols-5 gap-4 w-full"> 
                <!-- Aquí se insertarán dinámicamente las tarjetas del pronóstico -->

            </div>
          </div>
          
      </div>

     
 </div>

 
  </body>
 




  <script src="index.js"></script>
  <script src="pronostico.js"></script>
</html>
